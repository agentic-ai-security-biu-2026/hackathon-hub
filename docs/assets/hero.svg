<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" fill="none" role="img" aria-label="Layered agent security diagram">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8f542" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#7ec8a3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3d6b8a" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#0c1210"/>
  <!-- stacked trust planes -->
  <g stroke="url(#g)" stroke-width="1.5" opacity="0.9">
    <path d="M140 520 C320 470, 520 560, 720 500 C900 450, 1020 490, 1080 470" />
    <path d="M160 450 C340 400, 520 490, 720 430 C880 385, 1000 420, 1060 400" />
    <path d="M180 380 C360 330, 530 420, 720 360 C860 320, 980 350, 1040 335" />
    <path d="M200 310 C380 265, 540 350, 720 290 C840 255, 960 285, 1020 270" />
    <path d="M220 240 C400 200, 550 280, 720 220 C820 190, 940 215, 1000 205" />
  </g>
  <!-- agent node -->
  <g filter="url(#soft)">
    <circle cx="720" cy="290" r="18" fill="#c8f542"/>
    <circle cx="720" cy="290" r="36" stroke="#c8f542" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="720" cy="290" r="56" stroke="#c8f542" stroke-opacity="0.15" stroke-width="1.5"/>
  </g>
  <!-- tool / model / policy markers -->
  <g fill="#e8f0ea" font-family="Public Sans, sans-serif" font-size="13" letter-spacing="0.08em">
    <text x="150" y="535" fill="#9aafa2">RUNTIME</text>
    <text x="170" y="395" fill="#9aafa2">POLICY</text>
    <text x="190" y="255" fill="#9aafa2">IDENTITY</text>
  </g>
  <g stroke="#f0a56a" stroke-width="1.25" opacity="0.7">
    <path d="M720 290 L920 180"/>
    <path d="M720 290 L980 340"/>
    <path d="M720 290 L860 460"/>
  </g>
  <g fill="#f0a56a">
    <circle cx="920" cy="180" r="5"/>
    <circle cx="980" cy="340" r="5"/>
    <circle cx="860" cy="460" r="5"/>
  </g>
  <g fill="#9aafa2" font-family="Public Sans, sans-serif" font-size="12">
    <text x="935" y="175">tools</text>
    <text x="995" y="345">model</text>
    <text x="875" y="465">data</text>
  </g>
</svg>
